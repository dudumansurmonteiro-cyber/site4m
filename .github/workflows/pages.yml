name: Deploy GitHub Pages

on:
  # Deploy manual apenas: o site é publicado pelo branch de trabalho
  # (claude/claude-md-briefing-9og1ab), que contém o conteúdo mais recente.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build no domínio oficial (www.grupo4m.com); public/CNAME informa o
      # domínio ao GitHub Pages.
      - run: npx astro build
      - name: Publica o build na branch gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy do site (build automático de ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
