name: Deploy GitHub Pages

on:
  push:
    branches: [claude/claude-md-briefing-wra9g0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TEMPORÁRIO: enquanto o DNS do grupo4m.com não aponta para o GitHub Pages,
      # o preview roda em github.io/site4m. Quando o DNS estiver pronto, voltar a
      # buildar na raiz (`npx astro build`, sem --site/--base) e recriar public/CNAME
      # com "www.grupo4m.com".
      - run: npx astro build --site "https://dudumansurmonteiro-cyber.github.io" --base "/site4m"
      - name: Publica o build na branch gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy do site (build automático de ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
