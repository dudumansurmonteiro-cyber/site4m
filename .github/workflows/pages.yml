name: Publicar no GitHub Pages

# Deploy apenas manual: o branch paralelo (claude/claude-md-briefing-wra9g0)
# também publica no gh-pages; o gatilho automático foi removido para as duas
# versões não ficarem se sobrescrevendo. Rode via "Run workflow" no Actions.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-e-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build para o Pages (site em subcaminho)
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Desativa Jekyll (preserva a pasta _astro)
        run: touch dist/.nojekyll
      - name: Publica no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: 'Deploy do site (build automático)'
